name: Telegram Bot

on:
  schedule:
    - cron: "17 1,5,9,13 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_BOT_CHANNEL_ID: ${{ secrets.TELEGRAM_BOT_CHANNEL_ID }}
      TELEGRAM_BOT_ALLOWED_CHATS: ${{ secrets.TELEGRAM_BOT_ALLOWED_CHATS }}
      TELEGRAM_BOT_MAX_TRACKS: "50"
      TELEGRAM_BOT_MAX_FILE_MB: "45"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Telegram bot
        id: bot
        continue-on-error: true
        run: npm run bot:once

      - name: Build catalog
        if: always()
        run: npm run catalog

      - name: Commit catalog data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore(data): update katalog musik"
            git push
          fi

      - name: Fail if bot failed
        if: steps.bot.outcome == 'failure'
        run: exit 1
